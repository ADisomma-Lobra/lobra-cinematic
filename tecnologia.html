<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tecnologie &amp; Partner — Gruppo Lobra</title>
  <meta name="description" content="Le competenze del Gruppo Lobra su questa tecnologia: aree, moduli e piattaforme su cui lavoriamo." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="images/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <noscript><style>.reveal{opacity:1!important;transform:none!important;}</style></noscript>
</head>
<body data-page="tech">
  <div class="scroll-progress" id="scroll-progress"></div>
  <a class="skip-link" href="#main">Vai al contenuto principale</a>
  <header id="site-header" class="site-header"></header>

  <!--
    Single dynamic template for every vendor (?v=salesforce|sap|microsoft|odoo).
    Each vendor's content lives in its own Storyblok story ("tecnologia-<slug>"),
    with data/vendor-<slug>.json as the local fallback — a fifth partner with a
    dedicated page never means a new HTML file, just a new story.
  -->
  <main id="main">
    <div id="vendor-detail"></div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/partials.js"></script>
  <script src="js/cms.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/render.js"></script>
  <script src="js/motion.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      LobraMotion.initHeaderAndProgress();
      LobraRender.renderVendorDetail('vendor-detail').then(function () {
        LobraMotion.initReveals();
        LobraMotion.initMagnetic();
      });
    });
  </script>
</body>
</html>
