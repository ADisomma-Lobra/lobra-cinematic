<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="meta.title">Tecnologie &amp; Partner — Gruppo Lobra</title>
  <meta name="description" content="Salesforce, SAP, Microsoft, Odoo e le altre tecnologie su cui il Gruppo Lobra costruisce i progetti dei propri clienti." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="images/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <noscript><style>.reveal{opacity:1!important;transform:none!important;}</style></noscript>
</head>
<body data-page="tech">
  <div class="scroll-progress" id="scroll-progress"></div>
  <a class="skip-link" href="#main">Vai al contenuto principale</a>
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <header class="page-hero">
      <div class="container">
        <span class="eyebrow" data-i18n="hero.eyebrow">Tecnologie &amp; Partner</span>
        <h1 class="h1 reveal" style="margin-top:16px" data-i18n="hero.title">Le piattaforme che integriamo</h1>
        <p class="lede reveal" style="margin-top:18px" data-i18n="hero.lede">Siamo partner certificati sulle tecnologie enterprise più diffuse. Ogni piattaforma ha una pagina dedicata con le competenze specifiche del gruppo.</p>
      </div>
    </header>

    <section class="section">
      <div class="container">
        <div class="grid grid-2" id="vendor-hub-grid"></div>
      </div>
    </section>

    <section class="section-tight section-divider">
      <div class="container">
        <h2 class="h3" data-i18n="other.title">Lavoriamo anche con</h2>
        <ul class="cluster" id="other-tech-list" style="margin-top:var(--space-6)"></ul>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/partials.js"></script>
  <script src="js/cms.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/render.js"></script>
  <script src="js/motion.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      LobraMotion.initHeaderAndProgress();
      Promise.all([
        LobraRender.renderVendorHub('vendor-hub-grid'),
        LobraRender.renderOtherTech('other-tech-list')
      ]).then(function () {
        LobraMotion.initReveals();
        LobraMotion.initMagnetic();
      });
    });
  </script>
</body>
</html>
